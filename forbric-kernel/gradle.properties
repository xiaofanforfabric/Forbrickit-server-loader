# Build JVM. 1536M is enough for the kernel's own compilation; raise it if a build ever OOMs.
org.gradle.jvmargs=-Xmx1536M

# No build daemon, deliberately. A daemon stays resident at its full -Xmx (~2GB observed here) after the
# build finishes and competes with a running server for RAM. What that buys is a few seconds off each
# invocation; what it costs is memory the operator needed. Re-enable per-invocation with `--daemon` when
# building in a tight loop, rather than making everyone pay for it.
org.gradle.daemon=false

# One build at a time: this project's two halves share staged artifacts, and a parallel build would also
# hold a second worker heap.
org.gradle.parallel=false

group = net.forbric
description = Forbrickit Kernel — a sovereign unified Minecraft server (Fabric + Forge + NeoForge + Bukkit/Paper)
url = https://cnb.cool/xiaofanforandroid/Forbrickit-server-loader

# Pure-bytecode / mapping / data machinery reused from the forbric-loader substrate (Apache-2.0).
# Keep aligned with forbric-loader/gradle.properties so the shared toolchain matches.
asm_version = 9.10.1
mixin_version = 0.17.3+mixin.0.8.7
mixin_extras_version = 0.5.4
sat4j_version = 2.3.6
tiny_remapper_version = 0.14.0
class_tweaker_version = 0.3.0-beta.2
mapping_io_version = 0.7.1

night_config_version = 3.8.1

junit_version = 5.9.2
